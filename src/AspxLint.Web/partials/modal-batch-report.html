<!-- Batch Report (apres Tout corriger / Tout enregistrer) -->
<div class="modal-overlay" id="batchReportModal">
  <div class="modal batch-report-modal">
    <div class="modal-header">
      <span class="modal-title" id="batchReportTitle">Rapport</span>
      <button class="btn ghost small" onclick="closeBatchReport()">×</button>
    </div>
    <div class="modal-body">
      <div class="batch-report-summary" id="batchReportSummary"></div>
      <div class="modal-section-title">Détail par fichier</div>
      <div class="batch-report-list" id="batchReportList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeBatchReport()">Fermer</button>
    </div>
  </div>
</div>
