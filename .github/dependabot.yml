version: 2

updates:
  # ----------------------------------------------------------------
  # Packages NuGet referencees dans les .csproj.
  # Groupe les patch-updates ensemble pour reduire le bruit des PRs.
  # ----------------------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps(nuget)"
    # Major bumps trop souvent breaking (coverlet 6→10, xunit 2→3,
    # microsoft-aspnetcore 9→10, etc.) — on les ignore et on les fera
    # manuellement quand on aura le temps de tester.
    # Outils qui ciblent .NET 10 RC alors qu'on est en .NET 9 : on lock
    # tant qu'on n'a pas migré l'environnement de dev.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MinVer"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "dotnet-reportgenerator-globaltool"
        update-types: ["version-update:semver-minor"]
    groups:
      patch-updates:
        applies-to: version-updates
        update-types:
          - "patch"
      microsoft-aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.NET.Test.Sdk"
      xunit:
        patterns:
          - "xunit*"
      playwright:
        patterns:
          - "Microsoft.Playwright*"

  # ----------------------------------------------------------------
  # Actions GitHub utilisees dans .github/workflows/ et .github/actions/
  # ----------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"
    # Idem : on ignore les major bumps (upload-artifact 4→7, setup-dotnet
    # 4→5, etc.) qui sont quasi systematiquement breaking. On les bumpera
    # manuellement quand on migrera vers Node 24 (deadline juin 2026).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
