name: docker

# Build et push de l'image AspxLint.Server vers GHCR.
#
# Tags produits :
#   - main                              (sur push branch main)
#   - latest                            (alias de main)
#   - X.Y.Z, X.Y, X                     (sur push tag vX.Y.Z)
#   - sha-abc1234                       (toujours, pour traceabilite)
#
# Pre-requis : aucun. GITHUB_TOKEN suffit pour pousser sur ghcr.io/<repo>.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (from tag or git sha)
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-sha.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=aspx-lint
            org.opencontainers.image.description=Linter et auto-fixer ASP.NET Web Forms
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test the freshly built image
        if: github.event_name != 'push' || github.ref != 'refs/tags/v*'
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          # Pas de --rm : on veut pouvoir lire les logs si le container crashe.
          docker run -d --name aspx-lint-smoke \
            -p 5174:5173 \
            -e ASPXLINT_API_KEY=smoke-test \
            "$IMAGE_TAG"

          ok=0
          for i in {1..30}; do
            if curl -fsS http://localhost:5174/healthz; then
              echo ""
              ok=1
              break
            fi
            sleep 1
          done

          # Toujours afficher les logs (utile meme si OK pour valider la sortie console)
          echo "===== container logs ====="
          docker logs aspx-lint-smoke 2>&1 || true
          docker rm -f aspx-lint-smoke > /dev/null 2>&1 || true

          if [ "$ok" = "1" ]; then
            echo "smoke test OK"
          else
            echo "smoke test FAILED"
            exit 1
          fi
