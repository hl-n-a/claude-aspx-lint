name: dependabot auto-merge

# Auto-approuve + auto-merge les PRs Dependabot pour les updates patch
# (semver-patch) + minor sur les actions GitHub. Les majors restent
# manuelles parce qu'elles cassent souvent l'API.
#
# La CI dotnet.yml doit passer avant le merge (la regle "Require status
# checks to pass before merging" est respectee par auto-merge --auto).
#
# Pre-requis dans Settings > General du repo :
#   [x] Allow auto-merge
#
# Pas de secret necessaire : on utilise GITHUB_TOKEN qui est auto-injecte.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch + minor-actions updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.package-ecosystem == 'github_actions' &&
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.package-ecosystem == 'github_actions' &&
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
