name: build + test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Force toutes les actions JS embarquees a tourner sur Node.js 24,
# meme celles qui declarent encore Node 20 dans leur action.yml.
# Permet d'ignorer les major bumps (v5/v6/v7/...) en attendant qu'ils
# soient stables sans subir le deprecation warning a chaque run.
# Date butoir GitHub : Node 20 retire le 16 sept 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF vers Code Scanning

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore aspx_lint.sln

      - name: Build
        run: dotnet build aspx_lint.sln --no-restore --configuration Release

      # ---------------------------------------------------------------
      # Tests : on lance toute la suite avec coverage. Les tests Desktop
      # qui requierent une session interactive sont taggues et tournent
      # quand meme sur le runner Windows (qui a une session GUI).
      # ---------------------------------------------------------------
      - name: Install Playwright browsers (Chromium)
        run: pwsh tests/AspxLint.E2E.Tests/bin/Release/net9.0/playwright.ps1 install chromium

      - name: Run all tests with coverage
        # Les tests Desktop FlaUI sont skip en CI : le runner Windows-hosted
        # n'a pas de session interactive WPF utilisable, le QrWindow ne
        # s'affiche pas, et FlaUI.Application.Attach echoue.
        # Ils restent runables localement (sur poste avec session GUI).
        run: >
          dotnet test aspx_lint.sln
          --no-build
          --configuration Release
          --filter "Category!=RequiresDesktop"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory coverage/raw
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      # ---------------------------------------------------------------
      # Rapport coverage — HTML pour artefact + Cobertura pour Codecov
      # ---------------------------------------------------------------
      - name: Generate coverage report
        if: always()
        run: >
          dotnet reportgenerator
          "-reports:coverage/raw/**/coverage.cobertura.xml"
          "-targetdir:coverage/html"
          "-reporttypes:Html;TextSummary;Cobertura"

      - name: Coverage summary in job log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path coverage/html/Summary.txt) {
            Get-Content coverage/html/Summary.txt
            "## Coverage" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content coverage/html/Summary.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/html/Cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

      # ---------------------------------------------------------------
      # SARIF : on scanne le code de la solution avec aspx-lint lui-meme,
      # et on uploade le rapport dans GitHub Code Scanning.
      # ---------------------------------------------------------------
      - name: Self-scan with aspx-lint
        # `scan` retourne exit 1 quand des issues sont trouvees (par design).
        # On veut produire le SARIF pour Code Scanning sans faire echouer la CI :
        # `|| true` neutralise l'exit code, le SARIF est ecrit quand meme.
        if: always()
        shell: pwsh
        run: |
          dotnet run --project src/AspxLint.Cli --no-build --configuration Release -- scan tests/fixtures --sarif > aspx-lint.sarif
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            Write-Host "::error::aspx-lint scan returned unexpected exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          exit 0

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3.37.8
        with:
          sarif_file: aspx-lint.sarif
        continue-on-error: true

      # ---------------------------------------------------------------
      # Pack du CLI en global tool NuGet : produit nupkg/aspx-lint.X.Y.Z.nupkg
      # qu'on uploade en artefact pour pouvoir l'installer ailleurs ou le
      # pousser sur nuget.org dans une etape ulterieure (release tag).
      # ---------------------------------------------------------------
      - name: Pack CLI as NuGet global tool
        run: dotnet pack src/AspxLint.Cli --configuration Release --no-build --output nupkg

      - name: Upload nupkg artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspx-lint-nupkg
          path: nupkg/*.nupkg
          retention-days: 30

      - name: Smoke test the packaged tool
        run: |
          dotnet tool install --global --add-source ./nupkg aspx-lint
          aspx-lint --version
          aspx-lint scan tests/fixtures --severity error
        shell: pwsh
        continue-on-error: true

  # ===================================================================
  # Deploy GitHub Pages — uniquement apres un push sur main qui a passe
  # la CI. Pre-requis : Settings > Pages > Source: GitHub Actions.
  #
  # On publie le site stats (docs/) avec injection des chiffres live
  # (coverage, rule count, test count, etc.) + le rapport coverage HTML
  # browsable sous /coverage/.
  #   https://<user>.github.io/<repo>/           → stats site
  #   https://<user>.github.io/<repo>/coverage/  → rapport coverage
  # ===================================================================
  deploy-pages:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (pour docs/ et compteurs de regles)
        uses: actions/checkout@v5

      - name: Download coverage HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: coverage-html

      - name: Build site Pages (docs/ + coverage/)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # Site stats : docs/ a la racine.
          cp -R docs/* _site/
          # Rapport coverage HTML sous /coverage/.
          mkdir -p _site/coverage
          cp -R coverage-html/* _site/coverage/

          # ==== Stats injectees dans index.html ====
          # Rule count : compte les classes dans Rules/ (1 fichier = 1 regle).
          RULE_COUNT=$(ls src/AspxLint.Core/Rules/*.cs 2>/dev/null | wc -l | tr -d ' ')
          # Auto-fix count : grep public bool HasFix => true; (pas false)
          AUTO_FIX_COUNT=$(grep -l "public bool HasFix => true" src/AspxLint.Core/Rules/*.cs 2>/dev/null | wc -l | tr -d ' ')
          # Coverage % depuis la cobertura (line + branch).
          COBERTURA=$(find coverage-html -name 'Cobertura.xml' -o -name 'coverage.cobertura.xml' | head -1)
          if [ -n "$COBERTURA" ]; then
            LINE_RATE=$(grep -oE 'line-rate="[0-9.]+"' "$COBERTURA" | head -1 | grep -oE '[0-9.]+')
            BRANCH_RATE=$(grep -oE 'branch-rate="[0-9.]+"' "$COBERTURA" | head -1 | grep -oE '[0-9.]+')
            COV_LINES=$(awk -v r="$LINE_RATE" 'BEGIN{printf "%.1f%%", r*100}')
            COV_BRANCH=$(awk -v r="$BRANCH_RATE" 'BEGIN{printf "%.1f%%", r*100}')
          else
            COV_LINES="—"
            COV_BRANCH="—"
          fi
          # Test count : compte les [Fact] et [Theory] recursivement dans tests/.
          TEST_COUNT=$(find tests -name '*.cs' -exec grep -lE '\[(Fact|Theory)\]' {} \; | xargs -I{} grep -cE '^\s*\[(Fact|Theory)\]' {} 2>/dev/null | awk '{s+=$1} END{print s}')
          # Lines of C# (tres approximatif).
          LOC=$(find src/ -name '*.cs' -exec cat {} + 2>/dev/null | wc -l | tr -d ' ')
          LOC_FMT=$(printf "%'d" "$LOC" | tr ',' ' ')
          # Build metadata
          BUILD_SHA="${GITHUB_SHA:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%d")

          echo "Stats injectees :"
          echo "  RULE_COUNT=$RULE_COUNT"
          echo "  AUTO_FIX_COUNT=$AUTO_FIX_COUNT"
          echo "  COV_LINES=$COV_LINES"
          echo "  COV_BRANCH=$COV_BRANCH"
          echo "  TEST_COUNT=$TEST_COUNT"
          echo "  LOC=$LOC_FMT"

          # sed-replace les placeholders dans _site/index.html.
          # Le placeholder par defaut suit la valeur courante ; le sed met a jour
          # si jamais le code/test a divergeralent et qu'on a oublie de la
          # bumper en meme temps.
          sed -i "s|id=\"ruleCount\">[0-9]\+<|id=\"ruleCount\">$RULE_COUNT<|g" _site/index.html
          sed -i "s|id=\"autoFixCount\">[0-9]\+ auto-fixables|id=\"autoFixCount\">$AUTO_FIX_COUNT auto-fixables|g" _site/index.html
          sed -i "s|>86\.6%<|>$COV_LINES<|g" _site/index.html
          sed -i "s|>77\.6%<|>$COV_BRANCH<|g" _site/index.html
          sed -i "s|430+ tests|$TEST_COUNT tests|g" _site/index.html
          sed -i "s|~5 000|~$LOC_FMT|g" _site/index.html
          sed -i "s|>main<|>$BUILD_SHA<|g" _site/index.html
          sed -i "s|>—</span></span>$|>$BUILD_DATE</span></span>|g" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
